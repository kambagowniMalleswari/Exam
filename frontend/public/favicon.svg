<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="64" height="64">
  <!-- Soft round background for crisp contrast across light & dark tabs -->
  <rect width="200" height="200" rx="36" fill="#ffffff" />

  <!-- Laurel wreath -->
  <g fill="#4ade80" stroke="#22c55e" stroke-width="1.5">
    <!-- Left Branch Curve -->
    <path d="M 100 162 C 65 158 32 135 32 95 C 32 65 52 40 76 30" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="40" cy="128" rx="12" ry="7" transform="rotate(-35 40 128)"/>
    <ellipse cx="30" cy="103" rx="13" ry="7" transform="rotate(-15 30 103)"/>
    <ellipse cx="30" cy="78" rx="13" ry="7" transform="rotate(10 30 78)"/>
    <ellipse cx="40" cy="55" rx="12" ry="7" transform="rotate(35 40 55)"/>
    <ellipse cx="56" cy="38" rx="12" ry="7" transform="rotate(55 56 38)"/>
    <ellipse cx="76" cy="28" rx="11" ry="6" transform="rotate(75 76 28)"/>

    <!-- Left Inner Leaves -->
    <ellipse cx="54" cy="118" rx="10" ry="6" transform="rotate(-20 54 118)"/>
    <ellipse cx="47" cy="93" rx="11" ry="6" transform="rotate(0 47 93)"/>
    <ellipse cx="50" cy="68" rx="11" ry="6" transform="rotate(25 50 68)"/>
    <ellipse cx="64" cy="48" rx="10" ry="6" transform="rotate(45 64 48)"/>

    <!-- Right Branch Curve -->
    <path d="M 100 162 C 135 158 168 135 168 95 C 168 65 148 40 124 30" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="160" cy="128" rx="12" ry="7" transform="rotate(35 160 128)"/>
    <ellipse cx="170" cy="103" rx="13" ry="7" transform="rotate(15 170 103)"/>
    <ellipse cx="170" cy="78" rx="13" ry="7" transform="rotate(-10 170 78)"/>
    <ellipse cx="160" cy="55" rx="12" ry="7" transform="rotate(-35 160 55)"/>
    <ellipse cx="144" cy="38" rx="12" ry="7" transform="rotate(-55 144 38)"/>
    <ellipse cx="124" cy="28" rx="11" ry="6" transform="rotate(-75 124 28)"/>

    <!-- Right Inner Leaves -->
    <ellipse cx="146" cy="118" rx="10" ry="6" transform="rotate(20 146 118)"/>
    <ellipse cx="153" cy="93" rx="11" ry="6" transform="rotate(0 153 93)"/>
    <ellipse cx="150" cy="68" rx="11" ry="6" transform="rotate(-25 150 68)"/>
    <ellipse cx="136" cy="48" rx="10" ry="6" transform="rotate(-45 136 48)"/>
  </g>

  <!-- Central Bold VMS text -->
  <text x="100" y="93" text-anchor="middle" dominant-baseline="central" fill="#2563eb" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="44" letter-spacing="1">VMS</text>

  <!-- Open Book in Green -->
  <g stroke="#22c55e" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 74 114 C 84 109 94 109 100 112 C 106 109 116 109 126 114 L 126 130 C 116 125 106 125 100 128 C 94 125 84 125 74 130 Z" />
    <line x1="100" y1="112" x2="100" y2="128" />
  </g>

  <!-- Step to Success in Blue -->
  <text x="100" y="174" text-anchor="middle" dominant-baseline="central" fill="#2563eb" font-family="'Times New Roman', serif" font-weight="700" font-size="11" letter-spacing="2">STEP TO SUCCESS</text>
</svg>
