<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="12" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Shield Shape -->
  <path d="M32 4 C44 4 54 11 56 22 C56 40 44 54 32 60 C20 54 8 40 8 22 C10 11 20 4 32 4 Z"
        fill="url(#shieldGrad)"
        stroke="#3b82f6"
        stroke-width="1.5"
        filter="url(#shadow)" />

  <!-- Inner Soft Glow -->
  <path d="M32 7 C42 7 51 13 53 23 C53 38 42 50 32 56 C22 50 11 38 11 23 C13 13 22 7 32 7 Z"
        fill="url(#innerGlow)" />

  <!-- Academic Cap / Mortarboard Outline in Gold -->
  <!-- Cap Top Diamond -->
  <polygon points="32,15 48,23 32,31 16,23"
           fill="url(#goldGrad)"
           stroke="#fef3c7"
           stroke-width="0.8" />

  <!-- Cap Skull Base -->
  <path d="M22 26.5 L22 35 C22 39 42 39 42 35 L42 26.5 C38 29.5 26 29.5 22 26.5 Z"
        fill="#b45309"
        opacity="0.95" />

  <!-- Tassel Ribbon & Bead -->
  <path d="M44 25 C45 30 46 34 46.5 37"
        stroke="#fef08a"
        stroke-width="1.5"
        stroke-linecap="round" />
  <circle cx="46.5" cy="38" r="1.5" fill="#fde047" />

  <!-- Verified Check / Quill Nib in Shield Center -->
  <path d="M26 44 L30 48 L39 39"
        stroke="#38bdf8"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>