<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AssessIQ — Multi-Tenant Online MCQ Examination & Test Management SaaS platform. Organization data isolation, timed tests, instant auto-evaluation, and advanced performance analytics." />
    <title>AssessIQ — Multi-Tenant Assessment Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="application-name" content="AssessIQ" />
    <script>
      window.addEventListener('error', function(e) {
        if (!document.getElementById('root') || document.getElementById('root').innerHTML === '') {
          var errDiv = document.createElement('div');
          errDiv.style = 'position:fixed;top:0;left:0;right:0;background:#fee2e2;color:#991b1b;padding:16px;z-index:99999;font-family:sans-serif;font-size:14px;';
          errDiv.innerText = 'Application startup notice: ' + (e.message || 'Error loading resources');
          document.body.appendChild(errDiv);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
